options:
  parse: yaml
  select: '$'
  assert:
    - path: '$.items'
      required: true
      containsElement:
        name: web
        metadata: {tier: edge, zone: a}
        ports: [80, 443]
    - path: '$.items[0]'
      eq: {name: web, metadata: {tier: edge, zone: a}, ports: [80, 443]}
      enum: [{name: web, metadata: {tier: edge, zone: a}, ports: [80, 443]}]
include: ["data.yaml"]
expected:
  outcome: pass
  findings: []
