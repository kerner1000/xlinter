# Absence semantics survive the lens: none of these paths exists inside the
# embedded document, and `absent: true` must pass rather than error.
options:
  parse: yaml
  decode: { path: "$.spec.valuesContent", as: yaml }
  select: '$'
  assert:
    - { path: '$.hostNetwork', absent: true }
    - { path: '$.service.externalIPs', absent: true }
    - { path: '$.service.spec.externalTrafficPolicy', absent: true }
    - { path: '$.service.externalTrafficPolicy', absent: true }
include: ["*.yaml"]
expected:
  outcome: pass
  findings: []
