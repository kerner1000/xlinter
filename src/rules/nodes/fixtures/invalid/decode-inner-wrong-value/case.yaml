# Position-offset regression: the finding must land on outer line 5, the line
# the operator actually has to edit — not on inner line 2, which in the outer
# file is "spec:".
options:
  parse: yaml
  decode: { path: "$.spec.valuesContent", as: yaml }
  select: '$'
  assert:
    - { path: '$.service.type', eq: ClusterIP, required: true }
include: ["*.yaml"]
expected:
  outcome: error
  findings:
    - file: traefik.yaml
      kind: mismatch
      line: 5
      docPath: '$.service.type'
      embeddedIn: '$.spec.valuesContent'
      messageIncludes: has the wrong value
