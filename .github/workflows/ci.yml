name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The same checks gate npm publish through prepublishOnly.
      - run: npm run verify
      # Outside verify, so the package-contract rule still runs if verify itself is edited down.
      - name: package contract
        run: node dist/cli/main.js .
