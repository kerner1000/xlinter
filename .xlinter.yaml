# xlinter's own policy — the dogfood config shipped in the bootstrap commit.
# Every rule here is load-bearing: doc pages must exist, be indexed, be named
# after their rule, and carry machine-readable frontmatter; the agent files
# must stay paired; package.json must keep its public contract.
version: 1
engine: ">=0.1.0"
namespace: xlinter
discovery: tracked
ignore:
  - "dist/**"
  - "node_modules/**"
  - "src/rules/*/fixtures/**"
  - "test/integration/repos/**"
rules:
  rule-doc-names:
    type: file-name
    targets: { include: ["docs/rules/*.md", "docs/adapters/*.md"] }
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*\.md$'
    allow: [README.md]
  rule-doc-frontmatter:
    type: nodes
    targets: { include: ["docs/rules/*.md"], exclude: ["docs/rules/README.md"] }
    parse: frontmatter
    select: "$"
    requireMatch: true
    assert:
      - path: "$.ruleId"
        required: true
        regex: '^[a-z0-9-]+$'
      - path: "$.defaultSeverity"
        required: true
        enum: [error, warn, note]
  rule-doc-title:
    type: first-heading
    targets: { include: ["docs/rules/*.md"], exclude: ["docs/rules/README.md"] }
    pattern: '^${stem}$'
  rule-doc-index:
    type: index-completeness
    targets: { include: ["docs/rules/*.md"] }
    index: docs/rules/README.md
    scope: { include: ["docs/rules/*.md"] }
    direction: both
  agent-files:
    type: file-pairing
    targets: { include: ["AGENTS.md", "CLAUDE.md"] }
    left: AGENTS.md
    right: CLAUDE.md
  package-contract:
    type: nodes
    targets: { include: ["package.json"] }
    parse: json
    select: "$"
    assert:
      - { path: "$.name", required: true, eq: "xlinter" }
      - { path: "$.license", required: true, eq: "Apache-2.0" }
      - { path: "$.type", required: true, eq: "module" }
      - { path: "$.engines.node", required: true, eq: ">=22" }
      # Pin the intended allowlist; the packlist test checks what npm actually packs.
      # A packaging change must deliberately update this policy too (including order).
      - path: "$.files"
        required: true
        eq: [dist, docs, schema, LICENSE, README.md]
      # The release gate. CI and prepublishOnly both trust these values, so a change to any of them
      # has to be deliberate. `required` matters: without it, deleting one passes.
      - path: "$.repository.url"
        required: true
        eq: "git+https://github.com/kerner1000/xlinter.git"
      - path: "$.scripts.build"
        required: true
        eq: "node -e \"require('node:fs').rmSync('dist',{recursive:true,force:true})\" && tsc -p tsconfig.build.json"
      - path: "$.scripts.test"
        required: true
        eq: "npm run build && tsc -p tsconfig.json && vitest run"
      - path: "$.scripts.verify"
        required: true
        eq: "npm test && node dist/cli/main.js . && node dist/cli/main.js . --format json > /dev/null && node dist/cli/main.js rules --check-docs && node dist/tools/generate-schema.js && git diff --exit-code -- schema/xlinter-config.schema.json"
      - path: "$.scripts.prepublishOnly"
        required: true
        eq: "node scripts/check-publish-source.mjs && npm run verify && node scripts/check-publish-source.mjs"
      # These run after prepublishOnly's final source check. Keep the release lifecycle
      # there: prepack/prepare can change packed files; postpack runs after packing;
      # publish/postpublish run after publication.
      - { path: "$.scripts.prepack", absent: true }
      - { path: "$.scripts.prepare", absent: true }
      - { path: "$.scripts.postpack", absent: true }
      - { path: "$.scripts.publish", absent: true }
      - { path: "$.scripts.postpublish", absent: true }
adapters:
  markdownlint:
    config: .markdownlint.yaml
    severity: error
